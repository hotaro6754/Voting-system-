services:
  # Backend Web Service
  - type: web
    name: election-platform-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false

  # Frontend Static Site
  - type: static
    name: election-platform-ui
    rootDir: client
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: election-platform-api
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
